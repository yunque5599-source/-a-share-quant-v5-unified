name: V16 early-trend shadow tests

on:
  push:
    branches:
      - feature/v16-early-trend-onset
    paths:
      - 'research/v16_config.js'
      - 'research/v16_early_trend.js'
      - 'research/V16_RESEARCH_PROTOCOL.md'
      - 'tests/v16_early_trend.test.js'
      - '.github/workflows/v16-early-trend-shadow.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/v16_config.js'
      - 'research/v16_early_trend.js'
      - 'research/V16_RESEARCH_PROTOCOL.md'
      - 'tests/v16_early_trend.test.js'
      - '.github/workflows/v16-early-trend-shadow.yml'

permissions:
  contents: read

jobs:
  v16-early-trend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check research/v16_config.js
          node --check research/v16_early_trend.js
          node --check tests/v16_early_trend.test.js
      - name: Run deterministic V16 tests
        run: node --test tests/v16_early_trend.test.js
