name: V13 historical limit-up replay

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Signal cutoff date (YYYY-MM-DD)'
        required: true
        default: '2026-10-20'
      concurrency:
        description: 'Concurrent public data requests (1-32)'
        required: true
        default: '6'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect point-in-time bars and replay V13
        env:
          AS_OF: \${{ github.event.inputs.as_of || '2026-10-20' }}
        run: |
          node research/v13-limitup-precursor/historical_replay.js --as-of "$AS_OF" --out-dir output/v13-history-replay --concurrency \${{ github.event.inputs.concurrency || '14' }}
      - name: Upload replay dataset and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-historical-replay-\${{ github.event.inputs.as_of || '2026-10-20' }}
          path: output/v13-history-replay/
          if-no-files-found: warn
          retention-days: 30
