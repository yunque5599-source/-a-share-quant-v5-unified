name: V13 limit-up precursor tests
on:
  push:
    branches: [research/v13-limitup-precursor]
    paths:
      - 'research/v13-limitup-precursor/**'
      - 'tests/v13_next_day_action_plan.test.js'
      - 'research/v13-limitup-precursor/fetch_previous_snapshot.js'
      - 'tests/v13_core_selection.test.js'
      - 'tests/v13_pre_breakout.test.js'
      - 'tests/v13_policy_alignment.test.js'
      - 'api/v13_prelimitup.js'
      - 'index.html'
      - 'tests/v13_limitup_precursor.test.js'
      - 'tests/v13_historical_replay.test.js'
      - 'tests/v13_walk_forward_eval.test.js'
      - 'tests/v13_holdout_audit.test.js'
      - 'tests/v13_supervised_ranker.test.js'
      - 'tests/v13_live_snapshot.test.js'
      - '.github/workflows/v13-limitup-precursor-tests.yml'
  pull_request:
    paths:
      - 'research/v13-limitup-precursor/**'
      - 'tests/v13_next_day_action_plan.test.js'
      - 'tests/v13_core_selection.test.js'
      - 'api/v13_prelimitup.js'
      - 'index.html'
      - 'tests/v13_limitup_precursor.test.js'
      - 'tests/v13_historical_replay.test.js'
      - 'tests/v13_walk_forward_eval.test.js'
      - 'tests/v13_holdout_audit.test.js'
      - 'tests/v13_supervised_ranker.test.js'
      - 'tests/v13_live_snapshot.test.js'
      - '.github/workflows/v13-limitup-precursor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check V13 endpoint and browser script syntax
        run: |
          node --check api/v13_prelimitup.js
          node --check research/v13-limitup-precursor/live_snapshot.js
          node --check research/v13-limitup-precursor/core_selection.js
          node --check research/v13-limitup-precursor/pre_breakout.js
          node --check research/v13-limitup-precursor/next_day_action_plan.js
          node --check research/v13-limitup-precursor/fetch_previous_snapshot.js
          node -e "const fs=require('node:fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('inline script not found');fs.writeFileSync('/tmp/index-inline.js',m[1]);"
          node --check /tmp/index-inline.js
      - name: Run V13 research tests
        run: node --test tests/v13_pre_breakout.test.js tests/v13_limitup_precursor.test.js tests/v13_next_day_action_plan.test.js tests/v13_core_selection.test.js tests/v13_historical_replay.test.js tests/v13_walk_forward_eval.test.js tests/v13_holdout_audit.test.js tests/v13_supervised_ranker.test.js tests/v13_live_snapshot.test.js tests/v13_policy_alignment.test.js
