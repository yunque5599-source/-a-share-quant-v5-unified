name: V13 walk-forward evaluation
concurrency:
  group: v13-walk-forward-evaluation
  cancel-in-progress: true

on:
  push:
    branches: [research/v13-limitup-precursor]
    paths:
      - 'research/v13-limitup-precursor/precursor_score.js'
      - 'research/v13-limitup-precursor/core_selection.js'
      - 'research/v13-limitup-precursor/pre_breakout.js'
      - 'research/v13-limitup-precursor/policy_alignment.js'
      - 'research/v13-limitup-precursor/walk_forward_eval.js'
      - 'research/v13-limitup-precursor/holdout_audit.js'
      - 'research/v13-limitup-precursor/supervised_ranker.js'
      - '.github/workflows/v13-walk-forward-evaluation.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find latest successful historical replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v13-limitup-historical-replay.yml --branch research/v13-limitup-precursor --limit 20 --json databaseId,conclusion,createdAt --jq '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | last | .databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful V13 historical replay run found." >&2
            exit 1
          fi
          ARTIFACT_NAME=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("v13-historical-replay-"))] | sort_by(.created_at) | last | .name')
          if [ -z "$ARTIFACT_NAME" ] || [ "$ARTIFACT_NAME" = "null" ]; then
            echo "Replay artifact name not found for run $RUN_ID." >&2
            exit 1
          fi
          echo "REPLAY_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "REPLAY_ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "Using replay run $RUN_ID and artifact $ARTIFACT_NAME"
      - name: Download replay dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPLAY_ARTIFACT_NAME }}
          run-id: ${{ env.REPLAY_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: output/v13-history-replay
      - name: Validate replay quality and choose fallback if needed
        id: validate_replay
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, appendFileSync, rmSync, mkdirSync } from 'node:fs';
          const reportPath = 'output/v13-history-replay/replay_report.json';
          let report = null;
          try {
            if (existsSync(reportPath)) report = JSON.parse(readFileSync(reportPath, 'utf8'));
          } catch {}
          const coverage = Number(report?.coverage?.barCoveragePct);
          const status = report?.validation?.status;
          const targetCount = Number(report?.validation?.targetCount);
          const targetScoredCount = Number(report?.validation?.targetScoredCount);
          const missingTargets = Array.isArray(report?.validation?.missingTargetCodes)
            ? report.validation.missingTargetCodes.length : 0;
          const targetsComplete = Number.isFinite(targetCount) && targetCount > 0
            && targetScoredCount === targetCount && missingTargets === 0;
          const qualified = status === 'MEASURABLE' && Number.isFinite(coverage)
            && coverage >= 90 && targetsComplete;
          console.log(JSON.stringify({
            status: status ?? null, coverage: Number.isFinite(coverage) ? coverage : null,
            targetCount: Number.isFinite(targetCount) ? targetCount : null,
            targetScoredCount: Number.isFinite(targetScoredCount) ? targetScoredCount : null,
            missingTargets, targetsComplete, qualified
          }));
          if (!qualified) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'fallback=true\n');
            rmSync('output/v13-history-replay', { recursive: true, force: true });
            mkdirSync('output/v13-history-replay', { recursive: true });
            console.log('Latest successful replay is not quality-qualified; falling back to known-good run 39714377415.');
          } else {
            appendFileSync(process.env.GITHUB_OUTPUT, 'fallback=false\n');
          }
          NODE
      - name: Download last known qualified replay artifact
        if: steps.validate_replay.outputs.fallback == 'true'
        uses: actions/download-artifact@v4
        with:
          name: v13-historical-replay-2026-10-20
          run-id: 39714377415
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: output/v13-history-replay
      - name: Verify qualified replay files
        run: |
          test -s output/v13-history-replay/replay_candidates.ndjson
          test -s output/v13-history-replay/replay_report.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('output/v13-history-replay/replay_report.json', 'utf8'));
          const coverage = Number(report.coverage?.barCoveragePct);
          if (report.validation?.status !== 'MEASURABLE' || !Number.isFinite(coverage) || coverage < 90) {
            console.error(JSON.stringify({ status: report.validation?.status, coverage }));
            process.exit(1);
          }
          NODE
      - name: Evaluate point-in-time walk-forward performance
        run: |
          node research/v13-limitup-precursor/walk_forward_eval.js \
            --input output/v13-history-replay/replay_candidates.ndjson \
            --quality-report output/v13-history-replay/replay_report.json \
            --signal-days 60 \
            --output output/v13-history-replay/walk_forward_report.json
      - name: Audit screenshot holdout after ranking
        run: |
          node research/v13-limitup-precursor/holdout_audit.js \
            --input output/v13-history-replay/replay_candidates.ndjson \
            --quality-report output/v13-history-replay/replay_report.json \
            --targets research/v13-limitup-precursor/target_symbols.json \
            --output output/v13-history-replay/holdout_audit.json
      - name: Train and evaluate supervised point-in-time ranker
        run: |
          node research/v13-limitup-precursor/supervised_ranker.js \
            --input output/v13-history-replay/replay_candidates.ndjson \
            --quality-report output/v13-history-replay/replay_report.json \
            --targets research/v13-limitup-precursor/target_symbols.json \
            --signal-days 60 \
            --output output/v13-history-replay/supervised_report.json
      - name: Upload walk-forward, holdout and supervised reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-walk-forward-report
          path: |
            output/v13-history-replay/walk_forward_report.json
            output/v13-history-replay/holdout_audit.json
            output/v13-history-replay/supervised_report.json
          if-no-files-found: warn
          retention-days: 30
