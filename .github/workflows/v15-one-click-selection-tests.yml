name: V15 one-click selection tests

on:
  push:
    branches: [main]
    paths:
      - 'api/market.js'
      - 'index.html'
      - 'research/v15_one_click_selection.js'
      - 'research/v15_replay.js'
      - 'research/run_v15_replay.js'
      - 'research/V15_RESEARCH_PROTOCOL.md'
      - 'tests/v15_one_click_selection.test.js'
      - '.github/workflows/v15-one-click-selection-tests.yml'
  pull_request:
    paths:
      - 'api/market.js'
      - 'index.html'
      - 'research/v15_one_click_selection.js'
      - 'tests/v15_one_click_selection.test.js'
      - '.github/workflows/v15-one-click-selection-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check api/market.js
          node --check research/v15_one_click_selection.js
          node --check research/v15_replay.js
          node --check research/run_v15_replay.js
          node -e "const fs=require('node:fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('inline script not found');fs.writeFileSync('/tmp/index-inline.js',m[1]);"
          node --check /tmp/index-inline.js
      - name: Run one-click selection tests
        run: node --test tests/v15_one_click_selection.test.js
