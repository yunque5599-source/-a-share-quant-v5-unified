name: V13 live psychology and catalyst snapshot
concurrency:
  group: v13-live-psychology-capture
  cancel-in-progress: true
on:
  push:
    branches: [research/v13-limitup-precursor]
    paths:
      - 'research/v13-limitup-precursor/live_snapshot.js'
      - 'research/v13-limitup-precursor/precursor_score.js'
      - 'research/v13-limitup-precursor/policy_alignment.js'
      - '.github/workflows/v13-live-snapshot.yml'
  schedule:
    - cron: '15 1 * * 1-5'
    - cron: '45 2 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '15 5 * * 1-5'
    - cron: '45 6 * * 1-5'
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: 'Candidate funnel size (50-180)'
        required: true
        default: '120'
      wide_news_scan:
        description: 'Scan timestamped positive news across the full listed universe (slow)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check China A-share trading session
        id: session
        run: |
          node <<'NODE'
          const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
          const get=t=>p.find(x=>x.type===t)?.value, h=Number(get('hour')),m=Number(get('minute')),minute=h*60+m;
          const wd=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',weekday:'short'}).format(new Date());
          const yes=['Mon','Tue','Wed','Thu','Fri'].includes(wd)&&((minute>=570&&minute<690)||(minute>=780&&minute<900));
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'in_session='+yes+'\n');console.log('in_session='+yes);
          NODE
      - name: Capture timestamped snapshot
        if: steps.session.outputs.in_session == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '15 1 * * 1-5'
        env:
          WIDE_NEWS_SCAN: ${{ github.event.schedule == '15 1 * * 1-5' || github.event.inputs.wide_news_scan == 'true' }}
        run: |
          EXTRA_ARGS=""
          if [ "$WIDE_NEWS_SCAN" = "true" ]; then EXTRA_ARGS="--wide-news-scan"; fi
          node research/v13-limitup-precursor/live_snapshot.js --limit "${{ github.event.inputs.candidate_limit || '120' }}" --out output/v13-live-snapshots/snapshot.json $EXTRA_ARGS
      - name: Upload immutable snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-live-snapshot-${{ github.run_id }}
          path: output/v13-live-snapshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Print snapshot quality summary
        if: always()
        run: |
          if [ -s output/v13-live-snapshots/snapshot.json ]; then
            node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('output/v13-live-snapshots/snapshot.json','utf8'));console.log(JSON.stringify({snapshotId:x.snapshotId,capturedAt:x.capturedAt,recommendationStatus:x.recommendationStatus,recommendationsAvailable:x.recommendationsAvailable,quality:x.quality,top10:x.rankings?.overall?.slice(0,10).map(r=>({rank:r.rank,code:r.code,name:r.name,score:r.score,setup:r.setup}))},null,2))"
          else echo 'No snapshot created (outside session or source capture failed).'; fi
      - name: Enforce recommendation quality gate
        if: steps.session.outputs.in_session == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          if [ ! -s output/v13-live-snapshots/snapshot.json ]; then
            echo 'Snapshot is missing; no recommendations are available.'
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('output/v13-live-snapshots/snapshot.json','utf8'));if(x.recommendationsAvailable!==true){console.error('SOURCE_UNAVAILABLE: suppressing recommendations because source quality gates failed:',(x.quality?.reasons||[]).join(', '));process.exit(1)}"
