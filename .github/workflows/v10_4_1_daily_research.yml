name: V10.4.1 Daily Research

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run research validation
        run: |
          python -m compileall research/v10_4_1

      - name: Run research pipeline
        run: |
          python -m research.v10_4_1.pipeline_runner
        continue-on-error: true

      - name: Save research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v10-4-1-research-output
          path: research/v10_4_1/
