name: V16 research tests

on:
  push:
    branches:
      - research/v16-system-upgrade-20261104
    paths:
      - 'research/v16/**'
      - 'api/v16_market_context.js'
      - 'api/v16_snapshot_archive.js'
      - 'api/v16_backtest.js'
      - 'package.json'
      - 'vercel.json'
      - 'index_V16_MARKET_SHADOW.html'
      - 'tests/v16_market_system.test.js'
      - 'tests/v16_market_context.test.js'
      - 'tests/v16_narrative_theme.test.js'
      - 'tests/v16_selection_backtest.test.js'
      - 'tests/v16_snapshot_archive.test.js'
      - '.github/workflows/v16-research-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/v16/**'
      - 'api/v16_market_context.js'
      - 'index_V16_MARKET_SHADOW.html'
      - 'tests/v16_market_system.test.js'
      - 'tests/v16_market_context.test.js'
      - 'tests/v16_narrative_theme.test.js'
      - '.github/workflows/v16-research-tests.yml'

jobs:
  v16-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check V16 modules
        run: |
          node --check research/v16/market_transition.js
          node --check research/v16/overnight_global_impact.js
          node --check research/v16/sector_rotation.js
          node --check research/v16/decision_overlay.js
          node --check research/v16/replay.js
          node --check research/v16/narrative_theme.js
          node --check research/v16/selection_backtest.js
          node --check research/v16/snapshot_archive.js
          node --check api/v16_market_context.js
          node --check api/v16_snapshot_archive.js
          node --check api/v16_backtest.js
          node -e "const fs=require('node:fs');const h=fs.readFileSync('index_V16_MARKET_SHADOW.html','utf8');const m=h.match(/<script type=\\\"module\\\">([\\s\\S]*?)<\\/script>/);if(!m)throw Error('V16 module script not found');fs.writeFileSync('/tmp/v16-shadow.mjs',m[1]);"
          node --check /tmp/v16-shadow.mjs
      - name: Run V16 deterministic tests
        run: node --test tests/v16_market_system.test.js tests/v16_market_context.test.js tests/v16_narrative_theme.test.js tests/v16_selection_backtest.test.js tests/v16_snapshot_archive.test.js
